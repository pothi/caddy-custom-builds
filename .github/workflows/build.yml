name: Build Custom Caddy Binaries

on:
  workflow_dispatch:   # Manual trigger only - no automatic runs

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      # ======================
      # Build 1: Rate Limit (amd64)
      # ======================
      - name: Build Caddy with Rate Limit Module (Linux amd64)
        run: |
          xcaddy build --with github.com/mholt/caddy-ratelimit \
            --output caddy-ratelimit-linux-amd64

      - name: Make Rate Limit binary executable
        run: chmod +x caddy-ratelimit-linux-amd64

      # ======================
      # Build 2: Cloudflare DNS (arm64)
      # ======================
      - name: Build Caddy with Cloudflare DNS Module (Linux arm64)
        run: |
          xcaddy build --with github.com/caddy-dns/cloudflare \
            --output caddy-cloudflare-linux-arm64

      - name: Make Cloudflare binary executable
        run: chmod +x caddy-cloudflare-linux-arm64

      # ======================
      # Upload Artifacts
      # ======================
      - name: Upload Rate Limit Binary
        uses: actions/upload-artifact@v4
        with:
          name: caddy-ratelimit-linux-amd64
          path: caddy-ratelimit-linux-amd64

      - name: Upload Cloudflare Binary
        uses: actions/upload-artifact@v4
        with:
          name: caddy-cloudflare-linux-arm64
          path: caddy-cloudflare-linux-arm64

      # ======================
      # Create GitHub Release
      # ======================
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Caddy Custom Builds #${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            caddy-ratelimit-linux-amd64
            caddy-cloudflare-linux-arm64
          body: |
            **Custom Caddy Builds** - Manual run #${{ github.run_number }}

            ### Binaries
            - `caddy-ratelimit-linux-amd64` → includes **github.com/mholt/caddy-ratelimit**
            - `caddy-cloudflare-linux-arm64` → includes **github.com/caddy-dns/cloudflare**

            Built with latest `xcaddy` on Ubuntu.
