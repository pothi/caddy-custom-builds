name: Build Custom Caddy Binaries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest

      # ======================
      # Build 1: Rate Limit (amd64) - Native
      # ======================
      - name: Build Caddy with Rate Limit Module (Linux amd64)
        run: |
          xcaddy build --with github.com/mholt/caddy-ratelimit \
            --output caddy-ratelimit-linux-amd64

      # ======================
      # Build 2: Cloudflare DNS (arm64) - Cross compile
      # ======================
      - name: Build Caddy with Cloudflare DNS Module (Linux arm64)
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 \
          xcaddy build --with github.com/caddy-dns/cloudflare \
            --output caddy-cloudflare-linux-arm64

      # ======================
      # Get Caddy Version
      # ======================
      - name: Get Caddy Version
        id: version
        run: |
          VERSION=$(./caddy-ratelimit-linux-amd64 version | head -n1 | awk '{print $1}')
          echo "caddy_version=$VERSION" >> $GITHUB_OUTPUT
          echo "✅ Caddy version detected: $VERSION"

      # ======================
      # Rename binaries
      # ======================
      - name: Rename binaries with version
        run: |
          mv caddy-ratelimit-linux-amd64 caddy-ratelimit-${{ steps.version.outputs.caddy_version }}-linux-amd64
          mv caddy-cloudflare-linux-arm64 caddy-cloudflare-${{ steps.version.outputs.caddy_version }}-linux-arm64

      - name: Make binaries executable
        run: chmod +x caddy-*

      # ======================
      # Generate SHA256 Checksums
      # ======================
      - name: Generate SHA256 Checksums
        run: |
          echo "## SHA256 Checksums" > checksums.txt
          echo "" >> checksums.txt
          sha256sum caddy-ratelimit-${{ steps.version.outputs.caddy_version }}-linux-amd64 >> checksums.txt
          sha256sum caddy-cloudflare-${{ steps.version.outputs.caddy_version }}-linux-arm64 >> checksums.txt
          cat checksums.txt

      # ======================
      # Upload Artifacts + Create Release
      # ======================
      - name: Upload Rate Limit Binary
        uses: actions/upload-artifact@v4
        with:
          name: caddy-ratelimit-${{ steps.version.outputs.caddy_version }}-linux-amd64
          path: caddy-ratelimit-${{ steps.version.outputs.caddy_version }}-linux-amd64

      - name: Upload Cloudflare Binary
        uses: actions/upload-artifact@v4
        with:
          name: caddy-cloudflare-${{ steps.version.outputs.caddy_version }}-linux-arm64
          path: caddy-cloudflare-${{ steps.version.outputs.caddy_version }}-linux-arm64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ steps.version.outputs.caddy_version }}
          name: Caddy Custom Builds - ${{ steps.version.outputs.caddy_version }}
          draft: false
          prerelease: false
          files: |
            caddy-ratelimit-${{ steps.version.outputs.caddy_version }}-linux-amd64
            caddy-cloudflare-${{ steps.version.outputs.caddy_version }}-linux-arm64
          body_path: checksums.txt
          body: |
            **Custom Caddy Builds** — Manual run #${{ github.run_number }}

            **Caddy Version**: ${{ steps.version.outputs.caddy_version }}

            ### Binaries
            - `caddy-ratelimit-${{ steps.version.outputs.caddy_version }}-linux-amd64` → Rate Limit module
            - `caddy-cloudflare-${{ steps.version.outputs.caddy_version }}-linux-arm64` → Cloudflare DNS module (arm64)

            Built for: **Ubuntu 26.04 Server + WordPress**
